<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Academy Exam System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .subject-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .subject-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .subject-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
        .subject-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .subject-count {
            color: #666;
            font-size: 0.9em;
        }
        .question {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.8;
        }
        .statement-list {
            margin-top: 15px;
            padding-left: 0;
            list-style: none;
        }
        .statement-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 8px;
            padding: 8px 12px;
            background: #f8f9ff;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }
        .statement-label {
            font-weight: bold;
            color: #667eea;
            min-width: 35px;
        }
        .statement-text {
            flex: 1;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            display: flex;
            align-items: flex-start;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            flex-direction: column;
        }
        .option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        .option-letter {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 8px;
        }
        .option-text {
            white-space: pre-line;
            line-height: 1.6;
        }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #5a6fd6;
            transform: translateY(-2px);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        .btn-secondary {
            background: #666;
        }
        .btn-secondary:hover {
            background: #555;
        }
        .btn-back {
            background: #e0e0e0;
            color: #333;
        }
        .btn-back:hover {
            background: #ccc;
        }
        .progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            transition: width 0.3s;
        }
        .progress-text {
            text-align: center;
            color: #666;
            margin-bottom: 10px;
        }
        .result-card {
            text-align: center;
        }
        .score {
            font-size: 4em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .score-details {
            color: #666;
            font-size: 1.2em;
            margin: 20px 0;
        }
        .hidden {
            display: none;
        }
        .review-item {
            margin: 15px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: left;
        }
        .review-question {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .review-answer-correct {
            color: #22c55e;
            font-weight: bold;
            padding: 8px 12px;
            background: #dcfce7;
            border-radius: 6px;
            margin-top: 8px;
        }
        .review-answer-wrong {
            color: #ef4444;
            font-weight: bold;
            padding: 8px 12px;
            background: #fee2e2;
            border-radius: 6px;
            margin-top: 8px;
        }
        .review-your-answer {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
        .option.correct-answer {
            border-color: #22c55e;
            background: #dcfce7;
        }
        .option.wrong-answer {
            border-color: #ef4444;
            background: #fee2e2;
        }
        .option.correct-answer-selected {
            border-color: #22c55e;
            background: #22c55e;
            color: white;
        }
        .option.wrong-answer-selected {
            border-color: #ef4444;
            background: #ef4444;
            color: white;
        }
        .answer-feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }
        .answer-feedback.correct {
            background: #dcfce7;
            color: #22c55e;
            border: 2px solid #22c55e;
        }
        .answer-feedback.incorrect {
            background: #fee2e2;
            color: #ef4444;
            border: 2px solid #ef4444;
        }
        .correct-answer-display {
            margin-top: 8px;
            padding: 10px;
            background: #fef3c7;
            border: 2px solid #f59e0b;
            border-radius: 6px;
            color: #92400e;
            font-weight: bold;
        }
        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .badge-business { background: #3b82f6; color: white; }
        .badge-management { background: #10b981; color: white; }
        .badge-financial { background: #f59e0b; color: white; }
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .result-toggle {
            cursor: pointer;
            color: #667eea;
            text-decoration: underline;
            margin-bottom: 15px;
            display: inline-block;
        }
        .result-toggle:hover {
            color: #5a6fd6;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Subject Selection Screen -->
        <div class="card" id="subjectScreen">
            <h1>Business Academy Exam</h1>
            <p class="subtitle">Select a subject to start your exam</p>
            
            <div class="subject-grid">
                <div class="subject-card" onclick="loadSubject('business-environment')">
                    <div class="subject-icon">🏢</div>
                    <div class="subject-title">Business Environment</div>
                    <div class="subject-count">50 questions</div>
                </div>
                <div class="subject-card" onclick="loadSubject('introduction-to-management')">
                    <div class="subject-icon">⚙️</div>
                    <div class="subject-title">Introduction to Management</div>
                    <div class="subject-count">50 questions</div>
                </div>
                <div class="subject-card" onclick="loadSubject('personal-financial-management')">
                    <div class="subject-icon">💰</div>
                    <div class="subject-title">Personal Financial Management</div>
                    <div class="subject-count">50 questions</div>
                </div>
                <div class="subject-card" onclick="loadSubject('all')">
                    <div class="subject-icon">🎯</div>
                    <div class="subject-title">All Subjects</div>
                    <div class="subject-count">150 questions</div>
                </div>
            </div>
        </div>

        <!-- Exam Screen -->
        <div class="card hidden" id="examScreen">
            <div class="nav-header">
                <button class="btn btn-back" onclick="showSubjects()">← Back</button>
                <span class="badge" id="subjectBadge">Business Environment</span>
            </div>
            
            <div class="progress-text">Question <span id="currentNum">1</span> of <span id="totalNum">50</span></div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            
            <div class="question" id="questionText"></div>
            
            <div class="options" id="optionsContainer"></div>
            
            <div class="btn-group" id="navButtons">
                <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()" disabled>← Previous</button>
                <button class="btn" id="nextBtn" onclick="nextQuestion()">Next →</button>
                <button class="btn" id="submitBtn" onclick="submitExam()" style="display: none;">Submit</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div class="card result-card hidden" id="resultScreen">
            <h1>🎉 Exam Complete!</h1>
            <span class="badge" id="resultBadge" style="margin-bottom: 20px;"></span>
            <div class="score" id="scoreDisplay">0%</div>
            <div class="score-details" id="scoreDetails"></div>
            <div class="result-toggle" onclick="toggleReview()">Show/Hide Answer Review</div>
            <div id="reviewContainer"></div>
            <div class="btn-group">
                <button class="btn" onclick="restartExam()">Try Again</button>
                <button class="btn btn-secondary" onclick="showSubjects()">Choose Subject</button>
            </div>
        </div>
    </div>

    <script>
        let questions = [];
        let allQuestions = {};
        let currentIndex = 0;
        let userAnswers = [];
        let currentSubject = '';
        let showReview = true;

        const subjectNames = {
            'business-environment': 'Business Environment',
            'introduction-to-management': 'Introduction to Management',
            'personal-financial-management': 'Personal Financial Management',
            'all': 'All Subjects'
        };

        const subjectBadge = {
            'business-environment': 'badge-business',
            'introduction-to-management': 'badge-management',
            'personal-financial-management': 'badge-financial',
            'all': 'badge-business'
        };

        // Business Environment Questions - 50 questions
        allQuestions['business-environment'] = [

            { question: "The external environment of a business includes", statements: ["Economic factors", "Political factors", "Social factors"], options: ["I only", "I and II only", "II and III only", "I, II and III"], answer: 3 },

            { question: "Which of the following is a weakness in SWOT analysis?", statements: ["Outdated technology", "Strong financial position", "High employee turnover"], options: ["I only", "I and III only", "II and III only", "I, II and III"], answer: 1 },
            { question: "Technological factors affecting business include", statements: ["Automation", "Internet connectivity", "Research and development"], options: ["I only", "I and II only", "II and III only", "I, II and III"], answer: 3 },
            { question: "The social environment influences business through", statements: ["Consumer preferences", "Cultural values", "Lifestyle changes"], options: ["I only", "I and II only", "I, II and III", "II and III only"], answer: 2 },
            { question: "Which statements about PESTEL analysis are correct?", statements: ["P stands for Political", "E stands for Economic", "S stands for Social"], options: ["I only", "I and II only", "I, II and III", "II and III only"], answer: 2 },
            { question: "Business ethics involve", statements: ["Corporate social responsibility", "Fair dealing", "Transparency"], options: ["I only", "I and II only", "I, II and III", "II and III only"], answer: 2 },
            { question: "The political environment affects business through", statements: ["Trade policies", "Taxation policies", "Labor laws"], options: ["I only", "I and II only", "II and III only", "I, II and III"], answer: 3 },
            { question: "Opportunities in SWOT analysis refer to", statements: ["Favorable market conditions", "Government incentives", "Internal strengths"], options: ["I only", "I and II only", "II and III only", "I, II and III"], answer: 1 },
            { question: "The natural environment includes", statements: ["Climate conditions", "Resource availability", "Environmental regulations"], options: ["I only", "I and II only", "I, II and III", "II and III only"], answer: 2 },
            { question: "Which of the following is an example of a macroeconomic factor?", options: ["Company pricing", "National inflation rate", "Employee wages", "Local competition"], answer: 1 },
            { question: "The microenvironment of a business includes", statements: ["Customers", "Competitors", "Suppliers"], options: ["I only", "I and II only", "I, II and III", "II and III only"], answer: 2 },
            { question: "Which is NOT a component of the task environment?", options: ["Customers", "Technology", "Organizational culture", "Suppliers"], answer: 2 },
            { question: "The general environment consists of", statements: ["Economic conditions", "Social trends", "Political stability"], options: ["I only", "I and II only", "I, II and III", "II and III only"], answer: 2 },

        // Introduction to Management Questions - 50 questions
        allQuestions['introduction-to-management'] = [
            // Questions with I, II, III format
            { question: "The functions of management include", statements: ["Planning", "Organizing", "Staffing", "Controlling"], options: ["I and II only", "I, II and III", "II, III and IV only", "I, II, III and IV"], answer: 3 },

            { question: "What is departmentalization?", options: ["Dividing work into departments", "Hiring new employees", "Setting objectives", "Evaluating performance"], answer: 0 },
            { question: "Hawthorne experiments focused on", options: ["Work conditions and productivity", "Product design", "Marketing strategies", "Financial management"], answer: 0 },

        function loadSubject(subject) {
            currentSubject = subject;
            
            if (subject === 'all') {
                questions = [
                    ...allQuestions['business-environment'],
                    ...allQuestions['introduction-to-management'],
                    ...allQuestions['personal-financial-management']
                ];
            } else {
                questions = [...allQuestions[subject]];
            }
            
            // Shuffle questions
            questions = shuffleArray(questions);
            
            currentIndex = 0;
            userAnswers = new Array(questions.length).fill(null);
            showReview = true;
            
            document.getElementById('subjectBadge').textContent = subjectNames[subject];
            document.getElementById('subjectBadge').className = 'badge ' + subjectBadge[subject];
            
            showQuestion();
            document.getElementById('subjectScreen').classList.add('hidden');
            document.getElementById('examScreen').classList.remove('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function getQuestionHTML(q) {
            if (q.statements) {
                let statementsHTML = '<ul class="statement-list">';
                q.statements.forEach((stmt, i) => {
                    const labels = ['I', 'II', 'III', 'IV', 'V'];
                    statementsHTML += `<li class="statement-item"><span class="statement-label">${labels[i]}.</span><span class="statement-text">${stmt}</span></li>`;
                });
                statementsHTML += '</ul>';
                return q.question + statementsHTML;
            }
            return q.question;
        }

        function showQuestion() {
            const q = questions[currentIndex];
            document.getElementById('currentNum').textContent = currentIndex + 1;
            document.getElementById('totalNum').textContent = questions.length;
            document.getElementById('progressFill').style.width = ((currentIndex + 1) / questions.length * 100) + '%';
            
            document.getElementById('questionText').innerHTML = getQuestionHTML(q);
            
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            
            // Clear any existing feedback buttons
            const existingFeedbackBtns = document.querySelectorAll('.answer-feedback, .correct-answer-display');
            existingFeedbackBtns.forEach(el => el.remove());
            
            const hasAnswered = userAnswers[currentIndex] !== null;
            
            q.options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option';
                
                // Determine class based on whether question is answered
                if (hasAnswered) {
                    if (i === q.answer) {
                        div.classList.add('correct-answer');
                    }
                    if (userAnswers[currentIndex] === i) {
                        if (i === q.answer) {
                            div.classList.add('correct-answer-selected');
                        } else {
                            div.classList.add('wrong-answer-selected');
                        }
                    }
                } else {
                    if (userAnswers[currentIndex] === i) {
                        div.classList.add('selected');
                    }
                }
                
                div.innerHTML = `<span class="option-letter">${String.fromCharCode(65 + i)}.</span><span class="option-text">${opt}</span>`;
                
                if (!hasAnswered) {
                    div.onclick = () => selectOption(i);
                    div.style.cursor = 'pointer';
                } else {
                    div.style.cursor = 'default';
                }
                
                container.appendChild(div);
            });
            
            // Show feedback if answered
            let feedbackHTML = '';
            if (hasAnswered) {
                const isCorrect = userAnswers[currentIndex] === q.answer;
                feedbackHTML = `
                    <div class="answer-feedback ${isCorrect ? 'correct' : 'incorrect'}">
                        ${isCorrect ? '✓ Correct! Well done!' : '✗ Incorrect! The correct answer is: ' + q.options[q.answer]}
                    </div>
                    ${!isCorrect ? `<div class="correct-answer-display">Correct Answer: ${q.options[q.answer]}</div>` : ''}
                `;
            }
            
            // Add navigation buttons after answering
            if (hasAnswered) {
                feedbackHTML += `
                    <div class="btn-group" style="margin-top: 15px;">
                        ${currentIndex > 0 ? '<button class="btn btn-secondary" onclick="prevQuestion()">← Previous</button>' : ''}
                        ${currentIndex < questions.length - 1 ? '<button class="btn" onclick="nextQuestion()">Next →</button>' : '<button class="btn" onclick="submitExam()">Submit Exam</button>'}
                    </div>
                `;
            }
            
            container.insertAdjacentHTML('afterend', feedbackHTML);
            
            // Hide original nav buttons when showing feedback
            document.getElementById('navButtons').style.display = hasAnswered ? 'none' : 'flex';
        }

        function selectOption(index) {
            userAnswers[currentIndex] = index;
            showQuestion();
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                showQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                showQuestion();
            }
        }

        function clearFeedback() {
            const existingFeedback = document.querySelector('.answer-feedback');
            const existingBtnGroup = document.querySelector('#navButtons');
            if (existingFeedback) {
                const parent = existingFeedback.parentNode;
                const btnGroupInFeedback = existingFeedback.nextElementSibling;
                if (btnGroupInFeedback && btnGroupInFeedback.classList.contains('btn-group')) {
                    btnGroupInFeedback.remove();
                }
                existingFeedback.remove();
            }
            const correctDisplay = document.querySelector('.correct-answer-display');
            if (correctDisplay) correctDisplay.remove();
        }

        function submitExam() {
            const unanswered = questions.filter((_, i) => userAnswers[i] === null).length;
            if (unanswered > 0) {
                if (!confirm(`You have ${unanswered} unanswered question(s). Submit anyway?`)) {
                    return;
                }
            }
            showResults();
        }

        function toggleReview() {
            showReview = !showReview;
            document.getElementById('reviewContainer').style.display = showReview ? 'block' : 'none';
        }

        function showResults() {
            let correct = 0;
            let resultsHTML = '<div id="reviewContainer" style="display: block;">';
            
            questions.forEach((q, i) => {
                const userAns = userAnswers[i];
                const isCorrect = userAns === q.answer;
                if (isCorrect) correct++;
                
                resultsHTML += `
                    <div class="review-item">
                        <div class="review-question">Q${i + 1}: ${getQuestionHTML(q)}</div>
                        <div class="review-answer-correct">✓ Correct Answer: ${q.options[q.answer]}</div>
                        ${userAns !== null ? `
                            <div class="${isCorrect ? 'review-your-answer' : 'review-answer-wrong'}">
                                ${isCorrect ? 'Your answer was correct!' : `Your answer: ${q.options[userAns]}`}
                            </div>
                        ` : '<div class="review-answer-wrong">Not answered</div>'}
                    </div>
                `;
            });
            
            resultsHTML += '</div>';
            
            const percentage = Math.round((correct / questions.length) * 100);
            document.getElementById('scoreDisplay').textContent = percentage + '%';
            document.getElementById('scoreDetails').textContent = `${correct} out of ${questions.length} correct`;
            document.getElementById('reviewContainer').outerHTML = resultsHTML;
            document.getElementById('resultBadge').textContent = subjectNames[currentSubject];
            document.getElementById('resultBadge').className = 'badge ' + subjectBadge[currentSubject];
            
            document.getElementById('examScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
        }

        function restartExam() {
            questions = shuffleArray(questions);
            userAnswers = new Array(questions.length).fill(null);
            currentIndex = 0;
            showReview = true;
            showQuestion();
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('examScreen').classList.remove('hidden');
        }

        function showSubjects() {
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('examScreen').classList.add('hidden');
            document.getElementById('subjectScreen').classList.remove('hidden');
        }
    </script>

                {q: "Early withdrawal of MPF can be made for", o: ["Early retirement at age 60, Permanent departure from Hong Kong, Total incapacity", "(1) only", "(1) and (2) only", "(2) and (3) only"], a: 0},
                {q: "MPF employees can", o: ["Choose MPF funds, Change funds once a year, Bear investment risk", "(1) only", "(1) and (2) only", "(2) and (3) only"], a: 0},
                {q: "MPF employees aged 18 to 65 and employed for ___ days must join", o: ["60", "30", "90", "120"], a: 0},
                {q: "MPF voluntary contributions are", o: ["Not tax deductible", "Tax deductible", "Required", "Only for employers"], a: 0},
                {q: "Who chooses the MPF trustee?", o: ["Employer", "Employee", "Government", "Insurance company"], a: 0},
                {q: "Hang Seng Index is a", o: ["Stock market index", "Bond market index", "Commodity index", "Currency index"], a: 0},
                {q: "Blue chip stocks are", o: ["Stocks of well-established companies", "New startup companies", "Government bonds", "Foreign stocks"], a: 0},
                {q: "Factors affecting share prices include", o: ["Company performance, Economic conditions, Market sentiment", "(1) only", "(1) and (2) only", "(2) and (3) only"], a: 0},
                {q: "Ordinary shares represent", o: ["Ownership in a company", "A loan to a company", "A guarantee of returns", "A fixed deposit"], a: 0},
                {q: "Bonds provide", o: ["Interest return and capital gain", "Only dividend", "Only voting rights", "Ownership"], a: 0},
                {q: "Unsystematic risk can be reduced by", o: ["Diversification", "Higher leverage", "More debt", "Less investment"], a: 0},
                {q: "Systematic risk cannot be reduced by", o: ["Diversification", "Asset allocation", "Portfolio diversification", "None of the above"], a: 0},
                {q: "Effective rate formula is", o: ["(1 + r/m)^m - 1", "r × m", "r / m", "r + m"], a: 0},
                {q: "Credit card operators include", o: ["Visa, MasterCard, American Express", "Only banks", "Only government", "Only retailers"], a: 0}
            ]
        };
        function go(s) {
            subj = s;
            var allQ = s === 'all' ? data.be.concat(data.im, data.pfm) : data[s];
            qs = allQ.slice(0, s === 'all' ? 72 : 24);
            qs.sort(function() { return Math.random() - 0.5; });
            i = 0;
            ans = new Array(qs.length).fill(null);
            var badge = s === 'be' ? 'Business Environment' : s === 'im' ? 'Introduction to Management' : s === 'pfm' ? 'Personal Financial Management' : 'All Subjects';
            var badgeClass = s === 'be' ? 'badge-be' : s === 'im' ? 'badge-im' : s === 'pfm' ? 'badge-pfm' : 'badge-be';
            document.getElementById('badge').innerText = badge;
            document.getElementById('badge').className = 'badge ' + badgeClass;
            document.getElementById('t').innerText = qs.length;
            show();
            document.getElementById('home').className = 'hidden';
            document.getElementById('exam').className = 'card';
            document.getElementById('result').className = 'hidden';
        }
        function show() {
            document.getElementById('n').innerText = i + 1;
            document.getElementById('q').innerText = qs[i].q;
            var h = '';
            qs[i].o.forEach(function(o, j) {
                var cls = 'opt';
                if (ans[i] !== null) {
                    if (j === qs[i].a) cls += ' correct';
                    else if (j === ans[i]) cls += ' wrong';
                }
                h += '<div class="' + cls + '" onclick="' + (ans[i] === null ? 'pick(' + j + ')' : '') + '">' + String.fromCharCode(65+j) + '. ' + o + '</div>';
            });
            document.getElementById('opts').innerHTML = h;
            if (ans[i] !== null) {
                var fb = ans[i] === qs[i].a ? '<div class="feedback correct">✓ Correct!</div>' : '<div class="feedback wrong">✗ Wrong! Answer: ' + String.fromCharCode(65 + qs[i].a) + '</div>';
                document.getElementById('opts').insertAdjacentHTML('afterend', fb);
                var btn = i >= qs.length - 1 ? '<button class="btn" onclick="showResult()">Submit</button>' : '<button class="btn" onclick="nextQ()">Next →</button>';
                document.getElementById('opts').insertAdjacentHTML('afterend', '<div class="btn-group" style="margin-top:15px">' + btn + '</div>');
            }
        }
        function pick(j) { ans[i] = j; show(); }
        function nextQ() { i++; if (i >= qs.length) showResult(); else show(); }
        function showResult() {
            var c = 0;
            qs.forEach(function(q, j) { if (ans[j] === q.a) c++; });
            var p = Math.round(c / qs.length * 100);
            document.getElementById('s').innerText = p + '%';
            document.getElementById('d').innerText = c + ' out of ' + qs.length + ' correct';
            var badge = subj === 'be' ? 'Business Environment' : subj === 'im' ? 'Introduction to Management' : subj === 'pfm' ? 'Personal Financial Management' : 'All Subjects';
            var badgeClass = subj === 'be' ? 'badge-be' : subj === 'im' ? 'badge-im' : subj === 'pfm' ? 'badge-pfm' : 'badge-be';
            document.getElementById('badge2').innerText = badge;
            document.getElementById('badge2').className = 'badge ' + badgeClass;
            document.getElementById('exam').className = 'hidden';
            document.getElementById('result').className = 'card';
        }
        function home() { document.getElementById('exam').className = 'hidden'; document.getElementById('result').className = 'hidden'; document.getElementById('home').className = 'card'; }
        function retry() { go(subj); }
    </script>
